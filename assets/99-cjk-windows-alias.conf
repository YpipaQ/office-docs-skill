<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Windows/CJK 字体名 → 本机可用字库
  安装位置：/etc/fonts/conf.d/99-cjk-windows-alias.conf
  由 office-docs 技能维护；改完执行 fc-cache -f
-->
<fontconfig>

  <!-- 宋体族：必须落到衬线宋体，不能落到 Noto Sans（无衬线） -->
  <alias binding="same">
    <family>宋体</family>
    <prefer><family>AR PL SungtiL GB</family></prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>SimSun</family>
    <prefer><family>AR PL SungtiL GB</family></prefer>
    <default><family>serif</family></default>
  </alias>
  <alias binding="same">
    <family>新宋体</family>
    <prefer><family>AR PL SungtiL GB</family></prefer>
  </alias>
  <alias binding="same">
    <family>NSimSun</family>
    <prefer><family>AR PL SungtiL GB</family></prefer>
  </alias>
  <alias binding="same">
    <family>中易宋体</family>
    <prefer><family>AR PL SungtiL GB</family></prefer>
  </alias>
  <alias binding="same">
    <family>文鼎PL简报宋</family>
    <prefer><family>AR PL SungtiL GB</family></prefer>
  </alias>

  <!-- 仿宋族（公文正文用 3 号仿宋） -->
  <alias binding="same">
    <family>仿宋</family>
    <prefer><family>cwTeX 仿宋體</family><family>cwTeXFangSong</family></prefer>
  </alias>
  <alias binding="same">
    <family>FangSong</family>
    <prefer><family>cwTeX 仿宋體</family><family>cwTeXFangSong</family></prefer>
  </alias>
  <alias binding="same">
    <family>仿宋_GB2312</family>
    <prefer><family>cwTeX 仿宋體</family><family>cwTeXFangSong</family></prefer>
  </alias>
  <alias binding="same">
    <family>FangSong_GB2312</family>
    <prefer><family>cwTeX 仿宋體</family><family>cwTeXFangSong</family></prefer>
  </alias>

  <!-- 楷体族 -->
  <alias binding="same">
    <family>楷体</family>
    <prefer><family>LXGW WenKai</family><family>AR PL KaitiM GB</family></prefer>
  </alias>
  <alias binding="same">
    <family>KaiTi</family>
    <prefer><family>LXGW WenKai</family><family>AR PL KaitiM GB</family></prefer>
  </alias>
  <alias binding="same">
    <family>楷体_GB2312</family>
    <prefer><family>LXGW WenKai</family><family>AR PL KaitiM GB</family></prefer>
  </alias>
  <alias binding="same">
    <family>KaiTi_GB2312</family>
    <prefer><family>LXGW WenKai</family><family>AR PL KaitiM GB</family></prefer>
  </alias>
  <alias binding="same">
    <family>华文楷体</family>
    <prefer><family>LXGW WenKai</family><family>AR PL KaitiM GB</family></prefer>
  </alias>

  <!-- 黑体族：Noto Sans CJK 已经是合格的无衬线黑体 -->
  <alias binding="same">
    <family>黑体</family>
    <prefer><family>Noto Sans CJK SC</family><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <alias binding="same">
    <family>SimHei</family>
    <prefer><family>Noto Sans CJK SC</family><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <alias binding="same">
    <family>微软雅黑</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Microsoft YaHei</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>等线</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>DengXian</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>

  <!-- 标宋/小标宋（公文标题）：退到宋体 -->
  <alias binding="same">
    <family>方正小标宋简体</family>
    <prefer><family>AR PL SungtiL GB</family></prefer>
  </alias>
  <alias binding="same">
    <family>方正小标宋_GBK</family>
    <prefer><family>AR PL SungtiL GB</family></prefer>
  </alias>
  <alias binding="same">
    <family>华文中宋</family>
    <prefer><family>AR PL SungtiL GB</family></prefer>
  </alias>

</fontconfig>
